[input]
base =
rover =
nav =

[solver]
cutoff_deg = 15
systems = GC
use_ar = 1            # 模糊度固定(AR)
use_cycle_slip = 1
use_gf_cycle_slip = 1
full_covariance = 1   # 双差满阵 R 求逆做 GLS；false=对角近似
# 与 SPP 系同义的键：一个键喂两处，谁读谁用；ini 缺键时各用自己模式的默认值
#   ar_ratio_threshold = LAMBDA 成功率阈值
#   conv_eps           = 收敛阈值 (m)
#   min_sin_elev       = sin(el) 下限
# RTK 专有键（同样不加 rtk_ 前缀）：max_iter_float / max_iter_fix / min_sats /
#   code_over_phase_var / exclude_geo_ref / phase_weight_a / phase_weight_b

[output]
csv = gnss_rtk.csv
ref_x = 0
ref_y = 0
ref_z = 0
