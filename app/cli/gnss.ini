# GnssLab CLI
# 用法：gnss_cli.exe gnss.ini配置模板
#
# mode 取值（[solver] 段第一行）：
#   spp        单点定位
#   ppp_static PPP 静态解算
#   ppp_kin    PPP 动态解算
#   rtk        双差动态定位
#   leo        低轨定轨

[solver]
mode = spp              # spp | ppp_static | ppp_kin | rtk | leo

# ── 以下 [solver] 键 spp / ppp_static / ppp_kin / leo 都读 ──────────────
cutoff_deg = 15         # 截止高度角（度）
systems = GC            # 参与解算的系统，G R E C 任意组合
sample_interval = 0     # 抽稀间隔（s），0 = 不抽稀

sig_if_code = 0.3       # 无电离层组合码噪声 sigma（m）
sig_phase = 0.01        # 无电离层组合相位噪声 sigma（m）
min_sin_elev = 0        # 高度角定权下限 sin(el)，0 = 跟随 cutoff_deg

tropo_map = gmf         # hopfield | nmf | gmf | vmf3 | gpt3

conv_eps = 0.0001       # 收敛阈值（m）
max_iter = 10           # 最大迭代次数
min_check_iter = 2      # 从第几次迭代起判收敛

use_health = 1          # 剔除广播电文标不健康的卫星（0/1）
solid_tide = 1          # 固体潮改正（0/1）
windup = 1              # 相位缠绕改正（0/1）

isb_proc_noise = 0.001  # 系统间偏差过程噪声
isb_init_var = 1.0      # 系统间偏差初始方差

use_ar = 1              # 固定模糊度（0/1）
ar_ratio_threshold = 3.0        # LAMBDA 成功率阈值
ar_sig_gate = 5.0               # 进 LAMBDA 的模糊度 std 上限（m）
amb_init_var = 3600.0           # 模糊度初始方差
amb_q = 1.0e-8                  # 模糊度过程噪声
keep_amb_max_gap = 0.0          # 保持模糊度的最大间隙（s），0 = 一断就重置

use_cycle_slip = 1      # 周跳探测（0/1）；PPP 只探 MW
gf_slip_mult = 3.0      # GF 周跳阈值倍数

code_bias_proc_noise = 1.0e-8   # 码偏过程噪声
code_bias_init_var = 900.0      # 码偏初始方差
glo_ifcb_proc_noise = 1.0e-8    # GLONASS 频间码偏过程噪声
glo_ifcb_init_var = 900.0       # GLONASS 频间码偏初始方差

# ── 以下 [solver] 键 ppp_static / ppp_kin / leo 读 ────────────────────
use_tro_ztd = 1         # 用 tro 文件里的 ZTD 当虚拟观测；0 = 不用（回落到 ztd_prior 先验）
use_tro_grad = 1        # 估计东西/南北向对流层梯度
tro_ztd_sigma = 0.05    # ZTD 虚拟观测的 sigma0（m）
ztd_init = 0.0          # ZTD 初值（m）
ztd_init_var = 0.36     # ZTD 初始方差
ztd_q = 1.0e-8          # ZTD 过程噪声
ztd_prior = 0.30        # ZTD 先验 sigma（m）

first_epoch_pos_var = 3600.0    # 首历元位置方差
pos_var_floor = 1.0e-6          # 位置方差下界
min_sats_for_update = 0 # 滤波更新最少卫星数，0 = 不限
max_reanchor_iter = 8   # 重锚定最大迭代次数
clock_noise = 0.0       # 接收机钟差过程噪声
spp_residual_thr = 10.0 # SPP 残差 RMS 阈值（m），超限判历元不可用

# 位置过程噪声（m^2/epoch）：静态为 0（位置固定），动态为 100（逐历元更新）
pos_noise = 100.0

# ── 以下 [solver] 键只有 leo 读 ───────────────────────────────────────
motion_thresh = 100.0           # 运动检测阈值（m）
spp_vs_pred_thresh = 300.0      # SPP 解与预测位置差阈值（m）

# ── 以下 [solver] 键只有 rtk 读 ───────────────────────────────────────
full_covariance = 1    # 双差满阵 R 求逆做 GLS；0 = 对角近似
max_iter_float = 8     # 浮点解最大迭代次数
max_iter_fix = 6       # 固定解最大迭代次数
min_sats = 4           # 双差最少卫星数
use_gf_cycle_slip = 1  # 叠 GF 周跳探测（0/1）；与 MW 结果取或
phase_weight_a = 0.004 # 相位高度角模型 a（m）
phase_weight_b = 0.003 # 相位高度角模型 b（m）
code_over_phase_var = 10000.0   # 伪距 : 相位方差比
exclude_geo_ref = 1    # 排除北斗 GEO 卫星当参考星（0/1）

[input]
# 数据来源：file = 读文件，realtime = 实时流（用下面的 ip/port）
source = file

# 观测值。nav 填广播星历：sp3 为空时靠它取卫星位置
obs =
nav =

# 双站观测（rtk 用）
base =
rover =

# 基准站坐标（ECEF，m）
base_coord_x = 0
base_coord_y = 0
base_coord_z = 0

# 精密产品（可选）
sp3 =
clk =
osb =
atx =
erp =
att =
tro =                   # 对流层产品
ionex =                 # 电离层产品
vmf =                   # VMF3 格网，多个时次文件用 | 分隔
gpt3 =

# leo 用：GNSS 产品与参考轨道
gnss_sp3 =
gnss_clk =
gnss_brdc =
ref_sp3 =               # 参考轨道 SP3，给了才能出 RTN 评估
aux =                   # 辅助文件（.HDR 杠杆臂），多个文件用 | 分隔
ref_prn = 49            # 参考星 PRN；给了 ref_sp3 时以文件里的 L 星为准

# 实时流（source = realtime 时生效；rtk 用 base_* / rover_*）
ip =
port = 0
base_ip =
base_port = 0
rover_ip =
rover_port = 0

# 运行控制
realtime_sec = 0        # 实时解算时长上限（s），0 = 不限（此时回车停止）
max_epochs = 0          # 历元上限，0 = 不限

[output]
csv =                   # 留空则按模式取默认名（gnss_spp.csv 等）
ref_x = 0               # 已知参考坐标（ECEF，m），三轴全 0 = 不做偏差统计
ref_y = 0
ref_z = 0
