# GnssLab CLI
# 用法：gnss_cli.exe [gnss.ini] [--键 值 ...]
#
# --键 支持下面全部键，且优先于 ini 文件


[solver]
#   spp        单点定位
#   ppp_static PPP 静态解算
#   ppp_kin    PPP 动态解算
#   rtk        双差动态定位
#   leo        低轨定轨
#   ins        纯惯导动态导航
mode = spp              # spp | ppp_static | ppp_kin | rtk | leo | ins

# 不写按模式默认：SPP 逐历元最小二乘，PPP/LEO 前向滤波（RTK 用下方 rtk_filter）
smooth = forward        # none | forward | backward | both（combined 为旧写法）

# ── 以下 [solver] 键 spp / ppp_static / ppp_kin / leo 都读 ──────────────
cutoff_deg = 15         # 截止高度角（度）
systems = GC            # 参与解算的系统，G R E C 任意组合
sample_interval = 0     # 抽稀间隔（s），0 = 不抽稀

code_sigma = 0.3        # 无电离层组合码噪声 σ（m）
phase_sigma = 0.01      # 无电离层组合相位噪声 σ（m）
min_sin_elev = 0        # 高度角定权下限 sin(el)，0 = 跟随 cutoff_deg

tropo_map = gmf         # hopfield | nmf | gmf | vmf3 | gpt3

conv_eps = 0.0001       # 收敛阈值（m）
max_iter = 10           # 最大迭代次数
min_check_iter = 2      # 从第几次迭代起判收敛

use_health = 1          # 剔除广播电文标不健康的卫星（0/1）
solid_tide = 1          # 固体潮改正（0/1）
windup = 1              # 相位缠绕改正（0/1）

isb_proc_sigma = 0.0316228      # 系统间偏差过程 σ
isb_init_sigma = 1.0    # 系统间偏差初始 σ

use_ar = 1              # 固定模糊度（0/1）
ar_ratio_threshold = 3.0        # LAMBDA 成功率阈值
ar_gate_sigma = 5.0             # 进 LAMBDA 的模糊度 std 上限（m）
amb_init_sigma = 60.0           # 模糊度初始 σ
amb_proc_sigma = 1.0e-4         # 模糊度过程 σ
keep_amb_max_gap = 0.0          # 保持模糊度的最大间隙（s），0 = 一断就重置

use_cycle_slip = 1      # 周跳探测（0/1）；PPP 只探 MW
gf_slip_mult = 3.0      # GF 周跳阈值倍数

code_bias_proc_sigma = 1.0e-4   # 码偏过程 σ
code_bias_init_sigma = 30.0     # 码偏初始 σ
glo_ifcb_proc_sigma = 1.0e-4    # GLONASS 频间码偏过程 σ
glo_ifcb_init_sigma = 30.0      # GLONASS 频间码偏初始 σ

# ── 以下 [solver] 键 ppp_static / ppp_kin / leo 读 ────────────────────
use_tro_ztd = 1         # 用 tro 文件里的 ZTD 当虚拟观测；0 = 不用（回落到 ztd_prior_sigma 先验）
use_tro_grad = 1        # 估计东西/南北向对流层梯度
tro_ztd_sigma = 0.05    # ZTD 虚拟观测的 σ0（m）
ztd_init = 0.0          # ZTD 初值（m）
ztd_init_sigma = 0.6    # ZTD 初始 σ
ztd_proc_sigma = 1.0e-4 # ZTD 过程 σ
ztd_prior_sigma = 0.30  # ZTD 先验 σ（m）

first_epoch_pos_sigma = 60.0    # 首历元位置 σ
pos_floor_sigma = 1.0e-3        # 位置 σ 下界
min_sats_for_update = 0 # 滤波更新最少卫星数，0 = 不限
max_reanchor_iter = 8   # 重锚定最大迭代次数
clock_proc_sigma = 0.0  # 接收机钟差过程 σ
spp_residual_thr = 10.0 # SPP 残差 RMS 阈值（m），超限判历元不可用

# 位置过程 σ（m/epoch）：静态为 0（位置固定），动态为 10（逐历元更新）
pos_proc_sigma = 10.0

# 以下两个只有 spp 的滤波档生效（常速度模型 + 多普勒速度量测）；rtk 浮点解不接 CV
acc_proc_sigma = 0.01   # 加速度过程 σ（m/s²）：位置 p+=v·Δt、速度 Δv=a·Δt；0 = 不接常速度模型
vel_init_sigma = 10.0   # 速度状态初始 σ（m/s）
spp_clock_proc_sigma = 0.3      # SPP 钟差过程 σ（m/历元）；0 = 每历元自由估钟（PPP 用 clock_proc_sigma）

# ── 以下 [solver] 键只有 leo 读 ───────────────────────────────────────
motion_thresh = 100.0           # 运动检测阈值（m）
spp_vs_pred_thresh = 300.0      # SPP 解与预测位置差阈值（m）

# ── 以下 [solver] 键只有 rtk 读 ───────────────────────────────────────
full_covariance = 1    # 双差满阵 R 求逆做 GLS；0 = 对角近似
max_iter_float = 8     # 浮点解最大迭代次数
max_iter_fix = 6       # 固定解最大迭代次数
min_sats = 4           # 双差最少卫星数
use_gf_cycle_slip = 1  # 叠 GF 周跳探测（0/1）；与 MW 结果取或
phase_weight_a = 0.004 # 相位高度角模型 a（m）
phase_weight_b = 0.003 # 相位高度角模型 b（m）
code_over_phase_sigma = 100.0   # 伪距 σ : 相位 σ 的比值
exclude_geo_ref = 1    # 排除北斗 GEO 卫星当参考星（0/1）
# 滤波方向：none = 逐历元独立 LSQ（默认），forward/backward/both = 双差模糊度跨历元约束的 EKF
# backward 是事后倒序重放，both 再按位置 σ 融合两趟；整周固定两趟各自做，合并时固定解优先
# 位置 σ 用上面的 pos_proc_sigma
rtk_filter = none      # none | forward | backward | both
rtk_amb_init_sigma = 30.0       # 新弧段/参考星切换后的双差模糊度初值 σ（周）
rtk_amb_proc_sigma = 1.0e-2     # 双差模糊度随机游走 σ（周/历元）：给的是未建模误差（电离层/多路径）在弧段上的积累速度

[input]
# 数据来源：file = 读文件，realtime = 实时流（用下面的 ip/port）
source = file

# 观测值。nav 填广播星历：sp3 为空时靠它取卫星位置
obs =
nav =

# 双站观测（rtk 用）
base =
rover =

# 基准站坐标（ECEF，m）
base_coord_x = 0
base_coord_y = 0
base_coord_z = 0

# 精密产品（可选）
sp3 =
clk =
osb =
atx =
erp =
att =
tro =                   # 对流层产品
ionex =                 # 电离层产品
vmf =                   # VMF3 格网，多个时次文件用 | 分隔
gpt3 =

# leo 用：GNSS 产品与参考轨道
gnss_sp3 =
gnss_clk =
gnss_brdc =
aux =                   # .HDR 覆盖质心→ARP（留空＝自动取观测同目录的 .HDR）
leo_ant =               # 质心→ARP x,y,z（机体系 m；留空＝观测旁 .HDR，再退任务表）
leo_pco =               # ARP→相位中心 x,y,z（机体系 m；留空＝任务表，无值按 0）

# 实时流（source = realtime 时生效；rtk 用 base_* / rover_*）
ip =
port = 0
base_ip =
base_port = 0
rover_ip =
rover_port = 0

# ── 以下 [input] 键只有 ins 读（与 GUI「参数」页 PathMemory 键同名）────────
ins_imu =                       # IMU 日志（.gps 紧凑计数记录 / .ASC）
# 初始位置/速度同「验证」与 GNSS 各模式：BLH（纬度/经度/高程）+ vNED（北/东/地向），不再用 ECEF XYZ
ins_lat = 0                     # 初始纬度 φ（°，WGS84）
ins_lon = 0                     # 初始经度 λ（°，WGS84）
ins_h = 0                       # 初始高程 h（m）
ins_vn = 0                      # 初始北向速度 vN（m/s）
ins_ve = 0                      # 初始东向速度 vE（m/s）
ins_vd = 0                      # 初始地向速度 vD（m/s）
ins_specify_att = 0             # 1 = 手填初始姿态角（roll/pitch/heading）；0 = 从 IMU 开头自动粗对准
ins_roll = 0                    # ins_specify_att=1 时手填初始横滚（°）
ins_pitch = 0                   # 初始俯仰（°）
ins_heading = 0                 # 初始航向（°）
ins_zupt_accel_tol = 0.3        # 比力判静止容差（m/s²）；零速修正默认解算
ins_zupt_gyro_tol = 0.02        # 角速度判静止容差（rad/s）
ins_zupt_hold = 0.5             # 连续静止判据时长（s）
ins_accel_lsb = 0               # 手填加计当量 (m/s)/LSB，0 = 自动（型号自描述 / 开头静置段反推）
ins_gyro_lsb = 0                # 手填陀螺当量 rad/LSB
ins_rate_hz = 0                 # 手填采样率（Hz）；三项均 >0 才覆盖

# 运行控制
realtime_sec = 0        # 实时解算时长上限（s），0 = 不限（此时回车停止）
max_epochs = 0          # 历元上限，0 = 不限

[ref]
# ── 参考真值：逐历元偏差、ENU、LEO 的 RTN 全靠它；不填就只解不算偏差 ──────
# form 决定怎么用：auto（默认）= 有 x/y/z 就按恒值、否则有 sp3 就按文件；
#   fixed = 只认下面的 x/y/z（sp3 忽略）；file = 只认 sp3（x/y/z 忽略）。
# 模式限制：恒值只有 spp / ppp_static / rtk 接受，文件只有 spp / rtk /
#   ppp_kin / leo 接受；ppp_static 的静态解只用恒值，ins 不做参考对比。
# 两者都填时 auto 优先恒值；想换回文件就把 x/y/z 清 0。
form = auto
x = 0                   # 恒值参考真值 ECEF X（m）；三轴全 0 = 没填
y = 0                   # ECEF Y（m）
z = 0                   # ECEF Z（m）
sp3 =                   # 参考真值 SP3 路径（低轨精密轨道 / 测站真值轨迹），星号从文件里直接取

[output]
# ── 结果导出：格式 × 采样 × 元素 × 区间，四项各管各的 ──────────────────
# 格式按模式给可用项，写错或不支持时按 csv 导出并打一行提示：
#   spp / ppp_static / ppp_kin / rtk : csv | pos | sp3 | kml
#   leo                              : 上述 + orb（瞬根数）
#   ins                              : csv | traj | kml | sbet
format = csv
out =                   # 完整输出路径；留空则用下面的 csv 名按 format 换后缀
csv =                   # 留空则按模式取默认名（gnss_spp.csv 等）
interval = 0            # 导出抽稀（s），0 = 与解算一致；sp3 未给秒数时按 30 s
begin = 0               # 起始历元下标，0 = 第一个
end = 0                 # 结束历元下标，0 = 到末尾
fields =                # 逗号分隔的列（只对 csv 生效），留空 = 该模式默认列集
                        # 键见下表；例：wk,sow,x,y,z,lat,lon,h,pdop,sats

# 列键（写 fields 时用这些短名）：
#   时间   wk sow stat
#   坐标   x y z refx refy refz lat lon h e n u
#   浮点解 fx fy fz fe fn fu spfloat rms3df
#   固定解 kx ky kz ke kn ku spfix rms3dk
#   速度   vx vy vz vn ve vd
#   精度   pdop gdop hdop vdop tdop sp sv se sn su sats ratio
#   偏差   r t nrtn（需参考真值）
#   根数   sma ecc inc raan argp ma hp ha period
#   姿态   roll pitch heading
#   惯导   zupt zuptlat zuptlon zupth zuptvn zuptve zuptvd zuptroll zuptpitch
#          zuptheading zupte zuptn axb ayb azb wxb wyb wzb

# ── SP3 头信息（只在 format = sp3 时用）───────────────────────────────
sp3_sat = L01           # 卫星号，必须 3 字符（SP3 每行占 3 列）
sp3_marker = gnssLab    # 机构名；参考框架自动跟随精密轨道产品（无产品时按 IGS14）
sp3_velocity = 0        # 1 = 连速度行（V）一起写；只有 spp 估速度，别的模式写了也是 0

# ── POS 选项（只在 format = pos 时用）────────────────────────────────
pos_form = blh          # 位置列：blh（经纬高）| ecef（米）| enu（相对参考站，米）
pos_velocity = 1        # 1 = 末尾带速度列（只有 spp 有真值，其余写 0）
pos_header = 1          # 1 = 写 % 开头的文件头
