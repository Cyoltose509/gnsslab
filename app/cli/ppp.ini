[input]
obs =
nav =
sp3 =
clk =
atx =
osb =
erp =
tro =
ionex =

[solver]
cutoff_deg = 10
systems = GC
sig_if_code = 0.1
sig_phase = 0.01
use_tro_ztd = 1        # 仅当提供了 tro 文件时生效
use_cycle_slip = 1
use_gf_cycle_slip = 1
sat_pco = 1
sat_pcv = 1
solid_tide = 1
kinematic = 0          # 0=静态 1=运动学
pos_noise = 100.0      # 仅运动学有效（位置过程噪声 m^2/epoch）
motion_thresh = 0.0
spp_vs_pred_thresh = 300.0

[output]
csv = gnss_ppp.csv
ref_x = 0
ref_y = 0
ref_z = 0
