# GnssLab fetch_cli
# 用法：fetch_cli.exe [fetch.ini] [--键 值 ...]
#
# --键 支持下面全部键，且优先于 ini 文件：
#   fetch_cli --date 2026-215 --type sp3 --match COD0OPS,COD0MGX


[fetch]
# 日期，逗号分隔可混写：2026-215 | 2026-215..217（范围）；空 = 今天
date =

# 产品类型，逗号分隔多个：
#   nav 广播星历   sp3 精密轨道   clk 精密钟差   erp 地球自转   ionex 电离层
#   tro 对流层     osb 码偏差     vmf 映射函数   att 卫星姿态
#   obs 观测文件   leo_obs 低轨观测   leo_sp3 低轨轨道   snx 基站坐标(SINEX)
type =

# 数据中心筛选，逗号分隔多个，按源地址主机名匹配：whu cddis codes aiub ucar gfz …；空 = 全部
datacenter =

# 文件名匹配字段，逗号分隔
match =

# 每类型每天最多下几个；-1 = 不限
count_limit = 1

# 基站名（4 字符，如 ALIC）：自动搜索该站该日的 SINEX 并解出坐标
site =

# 低轨卫星名：S6A | S6B | Swarm A/B/C | COSMIC-2 | GRACE-FO
sat =

# 辅助产品同步更新，逗号分隔：atx | gpt3
update =

[earthdata]
# CDDIS / Earthdata 源的账号密码；只走国内镜像时可不填
user =
pass =
